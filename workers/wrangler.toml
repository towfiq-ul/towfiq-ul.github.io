name       = "portfolio-ai-proxy"
main       = "ai-proxy.js"
compatibility_date = "2026-06-01"

[vars]
# Chat models (comma-separated; first = primary, rest = fallbacks). All run on
# Workers AI's free daily allocation — no third-party API keys.
AI_MODELS = "@cf/meta/llama-3.1-8b-instruct-fp8-fast,@cf/ibm-granite/granite-4.0-h-micro"

# Secret, set via CLI — never in this file:
#   npx wrangler secret put INGEST_TOKEN   (any long random string; used by `npm run rag:ingest`)

# Workers AI — embeddings (bge-base-en-v1.5) + chat models.
[ai]
binding = "AI"
remote = true   # Workers AI always runs remotely; this just silences the dev warning

# Vector index of the portfolio content. Create once:
#   npx wrangler vectorize create portfolio-rag --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "portfolio-rag"
# Vectorize has no local simulator, so `wrangler dev` queries the real index.
# Note: POSTing to /ingest on the dev server writes to that real index too.
remote = true

# Bundle public/RULESET.md into the Worker as the system prompt.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Caps requests per client IP so a spoofed Origin header can't be used to
# burn the free daily Workers AI allocation. The worker checks `if (env.RATE_LIMITER)` and skips
# limiting if this binding isn't present, so it fails open rather than broken.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1