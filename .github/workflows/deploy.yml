name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Builds on every push and PR to master (PRs: build check only).
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild runs `sync:local`, regenerating the AI context docs from src/data.
      - name: Build project
        run: npm run build
        env:
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_RECEIVER_EMAIL: ${{ secrets.VITE_RECEIVER_EMAIL }}
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  # Only pushes to master ship to production.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Re-index the AI assistant's knowledge (Vectorize via the Worker's /ingest)
  # so its answers track the content that was just deployed.
  reindex-ai:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-index AI assistant (RAG)
        run: npm run rag:ingest
        env:
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
          RAG_INGEST_TOKEN: ${{ secrets.RAG_INGEST_TOKEN }}
